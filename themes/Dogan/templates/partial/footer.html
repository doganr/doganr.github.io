<footer class="site-footer">
  <div class="footer-glow"></div>
  <div class="container">
    <div class="row gy-4 align-items-center">

      <!-- Brand -->
      <div class="col-md-4 text-center text-md-start">
        <a href="{{ SITEURL }}/" class="footer-brand d-inline-flex align-items-center gap-2 text-decoration-none">
          {% if SITELOGO %}
          <img src="{{ SITEURL }}/{{ SITELOGO }}" alt="{{ SITENAME }}" class="footer-logo">
          {% endif %}
          <span class="footer-brand-name">{{ SITENAME }}</span>
        </a>
        {% if SITESUBTITLE %}
        <p class="footer-tagline mt-2 mb-0">{{ SITESUBTITLE }}</p>
        {% endif %}
      </div>

      <!-- Social Links -->
      {% if SOCIAL %}
      <div class="col-md-4 text-center">
        <div class="footer-social d-flex gap-3 justify-content-center">
          {% for name, link, icon in SOCIAL %}
          <a href="{{ link }}" target="_blank" rel="noopener noreferrer me" class="footer-social-btn"
            title="{{ name|capitalize }}">
            <i class="{{ icon }}"></i>
          </a>
          {% endfor %}
        </div>
      </div>
      {% endif %}

      <!-- Copyright -->
      <div class="col-md-4 text-center text-md-end">
        <p class="footer-copy mb-0">
          &copy; {{ now.year if now else '2026' }} <strong>{{ AUTHOR }}</strong>
        </p>
        <p class="footer-powered mt-1 mb-0">
          Powered by <a href="https://getpelican.com/" target="_blank" class="footer-link">Pelican</a>
          &amp; <a href="https://getbootstrap.com/" target="_blank" class="footer-link">Bootstrap 5</a>
        </p>
      </div>

    </div>

    <!-- Bottom bar -->
    <div class="footer-bottom mt-4 pt-3 text-center">
      <p class="footer-bottom-text mb-0">
        Built with <i class="fa-solid fa-code" style="color: var(--accent-2);"></i> and a lot of ☕
      </p>
    </div>
  </div>
</footer>
