{% extends "base.html" %}

{% block title %} – {{ page.title|striptags|escape }}{% endblock %}

{% block content %}
<div class="article-page-wrapper">
  <div class="article-hero">
    <div class="article-hero-bg"></div>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
          <h1 class="article-hero-title" id="{{ page.slug }}" data-aos="fade-up">
            {{ page.title }}
          </h1>
        </div>
      </div>
    </div>
  </div>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="article-content glass-card p-4 p-md-5 rounded-3" data-aos="fade-up">
          {{ page.content }}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
